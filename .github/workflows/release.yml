name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4
      - name: Build
        run: |
          for target in amd64: arm64:-aarch64 arm/v7:-armv7 arm/v6:-armv6; do
            docker run --rm --platform "linux/${target%%:*}" -v "$PWD":/src -w /src alpine:latest sh -c "apk add --no-cache build-base fortify-headers && cc -std=gnu17 -O2 -Wall -Wextra -Werror -U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=3 -fstack-protector-strong -fstack-clash-protection -fPIE -static-pie -Wl,-z,norelro,--gc-sections -s -o beszel-docker-gate${target#*:} src/*.c"
          done
      - name: Check that every binary answers
        run: |
          for bin in beszel-docker-gate beszel-docker-gate-*; do
            "./$bin" "$RUNNER_TEMP/$bin.sock" &
            for _ in $(seq 50); do [ -S "$RUNNER_TEMP/$bin.sock" ] && break; sleep 0.2; done
            [ "$(curl -s -o /dev/null -w '%{http_code}' --unix-socket "$RUNNER_TEMP/$bin.sock" http://localhost/info)" = 200 ]
            kill "$!"
          done
      - uses: actions/attest@v4
        with:
          subject-path: beszel-docker-gate*
      - name: Checksums
        run: sha256sum beszel-docker-gate* > SHA256SUMS
      - name: Attach the files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" beszel-docker-gate* SHA256SUMS
